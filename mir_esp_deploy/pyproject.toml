# mir/mir_esp_deploy/pyproject.toml
[project]
name = "mir_esp_deploy"
version = "0.1.0"
dependencies = ["mir_devices", "mir_utils", "PySide6", "bleak", "esptool"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mir_esp_deploy"]

[tool.setuptools.package-dir]
"mir_esp_deploy" = "."
